name: Post YouTube video to Strava

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:         # manual trigger for testing

jobs:
  post-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Add latest YouTube video link to latest Strava activity
        env:
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID:   ${{ secrets.YOUTUBE_CHANNEL_ID }}
          STRAVA_CLIENT_ID:     ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node --input-type=module <<'EOF'
          const YT_KEY     = process.env.YOUTUBE_API_KEY;
          const YT_CHANNEL = process.env.YOUTUBE_CHANNEL_ID;
          const S_ID       = process.env.STRAVA_CLIENT_ID;
          const S_SECRET   = process.env.STRAVA_CLIENT_SECRET;
          const S_REFRESH  = process.env.STRAVA_REFRESH_TOKEN;
          const CLAUDE_KEY = process.env.ANTHROPIC_API_KEY;

          if (!YT_KEY || !YT_CHANNEL || !S_ID || !S_SECRET || !S_REFRESH) {
            console.log('Missing required secrets — skipping.');
            process.exit(0);
          }

          // 1. Refresh Strava access token
          const tokenRes = await fetch('https://www.strava.com/oauth/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              client_id: S_ID,
              client_secret: S_SECRET,
              refresh_token: S_REFRESH,
              grant_type: 'refresh_token',
            }),
          });
          const tokenData = await tokenRes.json();
          if (!tokenData.access_token) {
            console.error('Strava token refresh failed:', JSON.stringify(tokenData));
            process.exit(1);
          }
          const access_token = tokenData.access_token;

          // 2. Fetch latest YouTube video uploaded in the last 24 hours
          const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
          const ytRes = await fetch(
            `https://www.googleapis.com/youtube/v3/search?part=snippet` +
            `&channelId=${encodeURIComponent(YT_CHANNEL)}` +
            `&type=video&order=date&maxResults=1` +
            `&publishedAfter=${encodeURIComponent(since)}` +
            `&key=${encodeURIComponent(YT_KEY)}`
          );
          const ytData = await ytRes.json();
          if (ytData.error) {
            console.error('YouTube API error:', JSON.stringify(ytData.error));
            process.exit(1);
          }
          const video = (ytData.items || [])[0];
          if (!video) {
            console.log('No YouTube video uploaded in the last 24 hours — skipping.');
            process.exit(0);
          }
          const videoUrl = `https://www.youtube.com/watch?v=${video.id.videoId}`;
          const videoPublished = new Date(video.snippet.publishedAt).getTime();
          const decodeEntities = (s) => s
            .replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"')
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>');
          const videoTitle = decodeEntities(video.snippet.title || '').trim();

          // 3. Fetch latest Strava activity
          const actRes = await fetch(
            'https://www.strava.com/api/v3/athlete/activities?per_page=1',
            { headers: { Authorization: `Bearer ${access_token}` } }
          );
          if (!actRes.ok) {
            console.error(`Strava activities fetch failed (${actRes.status}):`, await actRes.text());
            process.exit(1);
          }
          const activities = await actRes.json();
          const activity = (activities || [])[0];
          if (!activity) {
            console.log('No Strava activity found — skipping.');
            process.exit(0);
          }
          const actStart = new Date(activity.start_date).getTime();

          // 4. Video must have been published after the activity started
          if (videoPublished < actStart) {
            console.log(
              `YouTube video (${new Date(videoPublished).toISOString()}) predates ` +
              `activity start (${activity.start_date}) — skipping.`
            );
            process.exit(0);
          }

          // 5. Fetch the full activity (description, stats, segment names)
          const detRes = await fetch(
            `https://www.strava.com/api/v3/activities/${activity.id}`,
            { headers: { Authorization: `Bearer ${access_token}` } }
          );
          if (!detRes.ok) {
            console.error(`Strava activity fetch failed (${detRes.status}):`, await detRes.text());
            process.exit(1);
          }
          const detail = await detRes.json();
          const description = detail.description || '';
          if (description.includes('youtube.com')) {
            console.log('YouTube link already in activity description — skipping.');
            process.exit(0);
          }

          const mi = (detail.distance / 1609.344).toFixed(1);
          const totalMin = Math.round(detail.moving_time / 60);
          const timeStr = `${Math.floor(totalMin / 60)}:${String(totalMin % 60).padStart(2, '0')}`;
          const ft = Math.round((detail.total_elevation_gain || 0) * 3.28084).toLocaleString('en-US');

          // 6. Generate an understated title + plain, factual opener with Claude.
          //    Falls back to the existing title and the video title as the
          //    opener if the key is missing or the call fails.
          let title = null;
          let hook = videoTitle;
          if (CLAUDE_KEY) {
            try {
              const segments = [...new Set(
                (detail.segment_efforts || []).map(e => e.segment_name || (e.segment && e.segment.name)).filter(Boolean)
              )].slice(0, 12);
              const prompt = [
                'Write a title and an opening line for a Strava cycling activity.',
                '',
                'Style rules (apply to both):',
                '- Plain and factual. State what the route was — roads, terrain, landmarks — the way you\'d describe it to a friend, not narrate a feeling.',
                '- Weave in real place names from the segment list where natural.',
                '- Never mention PRs, achievements, speed, or performance — no bragging.',
                '- No calls to action, no hashtags, no emoji, no quotation marks.',
                '- BANNED: metaphor, personification (light/gravel/road "doing" something), rhetorical questions, invented internal feelings or unexplainable moments ("something I couldn\'t explain"), any line that sounds like the opening of a blog post or travel essay.',
                '- The opener should quietly make the reader curious enough to watch the ride video linked below it, without ever asking them to, and without overselling it.',
                '',
                'Title: a short activity title (roughly 3-7 words). Good example: "Morning Miles Under the Tetons".',
                'Opener: one or two short sentences for the top of the activity description. Good example (plain, factual, no metaphor): "Morning spin up Moose–Wilson Road and through the park to Jenny Lake — quiet roads, two stretches of gravel, and the Tetons out in full the whole way."',
                'Bad example (too flowery — do not write like this): "The gravel stretch north of the fee station has a way of pulling your eyes off the road and toward the ridgeline. Somewhere between Jenny Lake and the Moose entrance the morning light did something I couldn\'t quite explain."',
                '',
                'Ride data:',
                `- Current activity name: ${detail.name}`,
                `- Start (local): ${detail.start_date_local}`,
                `- Distance: ${mi} mi · Moving time: ${timeStr} · Elevation gain: ${ft} ft`,
                `- Video title: ${videoTitle}`,
                `- Segments ridden: ${segments.join('; ') || 'n/a'}`,
              ].join('\n');

              const claudeRes = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'x-api-key': CLAUDE_KEY,
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'claude-opus-4-8',
                  max_tokens: 1024,
                  messages: [{ role: 'user', content: prompt }],
                  output_config: {
                    format: {
                      type: 'json_schema',
                      schema: {
                        type: 'object',
                        properties: {
                          title: { type: 'string' },
                          opener: { type: 'string' },
                        },
                        required: ['title', 'opener'],
                        additionalProperties: false,
                      },
                    },
                  },
                }),
              });
              const claudeData = await claudeRes.json();
              if (claudeRes.ok && claudeData.stop_reason !== 'refusal') {
                const text = (claudeData.content || [])
                  .filter(b => b.type === 'text').map(b => b.text).join('').trim();
                const parsed = JSON.parse(text);
                if (parsed.title && parsed.title.length <= 100) {
                  title = parsed.title.trim();
                }
                if (parsed.opener && parsed.opener.length <= 400) {
                  hook = parsed.opener.trim();
                }
                console.log('Using Claude-generated title and opener.');
              } else {
                console.log('Claude API error — falling back to existing title / video title:', JSON.stringify(claudeData.error || claudeData.stop_reason));
              }
            } catch (err) {
              console.log('Claude call failed — falling back to existing title / video title:', err.message);
            }
          }

          // 7. Compose the description: opener, one stat line, camera line + link
          const parts = [];
          if (hook) parts.push(hook);
          parts.push(`${mi} mi · ${timeStr} · ${ft} ft`);
          parts.push(`Brought the camera along for this one 🎥\n${videoUrl}`);
          const block = parts.join('\n\n');
          const newDescription = description ? `${description}\n\n${block}` : block;

          // 8. Update the activity description (and title, if Claude generated one)
          //    (Strava's API no longer allows posting comments, so we update
          //    the activity directly instead — fully supported with activity:write)
          const updateBody = { description: newDescription };
          if (title) updateBody.name = title;
          const updRes = await fetch(
            `https://www.strava.com/api/v3/activities/${activity.id}`,
            {
              method: 'PUT',
              headers: {
                Authorization: `Bearer ${access_token}`,
                'Content-Type': 'application/x-www-form-urlencoded',
              },
              body: new URLSearchParams(updateBody).toString(),
            }
          );
          if (!updRes.ok) {
            const body = await updRes.text();
            console.error(`Strava activity update failed (${updRes.status}):`, body);
            process.exit(1);
          }
          console.log(`Updated Strava activity ${activity.id} (title: "${title || detail.name}") with ${videoUrl}`);
          EOF

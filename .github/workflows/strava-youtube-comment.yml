name: Post YouTube video to Strava

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:         # manual trigger for testing
    inputs:
      dry_run:
        description: 'Simulate only — log the title/description Claude would generate, never write to Strava or YouTube'
        required: false
        default: false
        type: boolean
      rider_notes_override:
        description: 'Optional rider notes to simulate with (dry run only) — data/ride-summary.json is usually already consumed by the time you want to preview'
        required: false
        default: ''
        type: string
      activity_id_override:
        description: 'Target this specific Strava activity id instead of your latest activity'
        required: false
        default: ''
        type: string
      title_override:
        description: 'Apply this exact title verbatim (skips the Claude call) — for re-applying a title/opener you already reviewed via dry_run'
        required: false
        default: ''
        type: string
      opener_override:
        description: 'Apply this exact opener verbatim (skips the Claude call) — replaces the description instead of appending to it'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  post-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read ride summary (if present)
        id: ride_summary
        run: |
          if [ -f data/ride-summary.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            { echo "summary<<RIDESUMMARY_EOF_9f3ac2"; cat data/ride-summary.json; echo; echo "RIDESUMMARY_EOF_9f3ac2"; } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add latest YouTube video link to latest Strava activity
        id: sync
        env:
          YOUTUBE_API_KEY:            ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID:         ${{ secrets.YOUTUBE_CHANNEL_ID }}
          STRAVA_CLIENT_ID:           ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET:       ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN:       ${{ secrets.STRAVA_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          MAPBOX_TOKEN:               ${{ secrets.MAPBOX_TOKEN }}
          RIDE_SUMMARY_JSON:          ${{ steps.ride_summary.outputs.summary }}
          DRY_RUN:                    ${{ github.event.inputs.dry_run }}
          RIDER_NOTES_OVERRIDE:       ${{ github.event.inputs.rider_notes_override }}
          ACTIVITY_ID_OVERRIDE:       ${{ github.event.inputs.activity_id_override }}
          TITLE_OVERRIDE:             ${{ github.event.inputs.title_override }}
          OPENER_OVERRIDE:            ${{ github.event.inputs.opener_override }}
          YOUTUBE_OAUTH_CLIENT_ID:     ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const YT_KEY     = process.env.YOUTUBE_API_KEY;
          const YT_CHANNEL = process.env.YOUTUBE_CHANNEL_ID;
          const S_ID       = process.env.STRAVA_CLIENT_ID;
          const S_SECRET   = process.env.STRAVA_CLIENT_SECRET;
          const S_REFRESH  = process.env.STRAVA_REFRESH_TOKEN;
          const CLAUDE_KEY = process.env.ANTHROPIC_API_KEY;
          const MAPBOX_TOKEN = process.env.MAPBOX_TOKEN;
          // Preview mode: logs the title/description Claude would generate against the
          // latest activity, but never writes to Strava or YouTube. Useful for testing
          // prompt/logic changes without spending a real post.
          const DRY_RUN = process.env.DRY_RUN === 'true';
          const RIDER_NOTES_OVERRIDE = (process.env.RIDER_NOTES_OVERRIDE || '').trim();
          // Manual apply mode: re-apply an exact title/opener you already reviewed via a
          // dry run, without letting Claude regenerate (possibly different) wording, and
          // targeting a specific activity instead of whatever's currently "latest".
          const ACTIVITY_ID_OVERRIDE = (process.env.ACTIVITY_ID_OVERRIDE || '').trim();
          const TITLE_OVERRIDE = (process.env.TITLE_OVERRIDE || '').trim();
          const OPENER_OVERRIDE = (process.env.OPENER_OVERRIDE || '').trim();
          const MANUAL_APPLY = Boolean(TITLE_OVERRIDE && OPENER_OVERRIDE);

          function emitOutput(key, value) {
            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
            }
          }

          if (!YT_KEY || !YT_CHANNEL || !S_ID || !S_SECRET || !S_REFRESH) {
            console.log('Missing required secrets — skipping.');
            process.exit(0);
          }

          // 1. Refresh Strava access token
          const tokenRes = await fetch('https://www.strava.com/oauth/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              client_id: S_ID,
              client_secret: S_SECRET,
              refresh_token: S_REFRESH,
              grant_type: 'refresh_token',
            }),
          });
          const tokenData = await tokenRes.json();
          if (!tokenData.access_token) {
            console.error('Strava token refresh failed:', JSON.stringify(tokenData));
            process.exit(1);
          }
          const access_token = tokenData.access_token;

          // 2. Fetch latest YouTube video uploaded in the last 24 hours
          const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
          const ytRes = await fetch(
            `https://www.googleapis.com/youtube/v3/search?part=snippet` +
            `&channelId=${encodeURIComponent(YT_CHANNEL)}` +
            `&type=video&order=date&maxResults=1` +
            `&publishedAfter=${encodeURIComponent(since)}` +
            `&key=${encodeURIComponent(YT_KEY)}`
          );
          const ytData = await ytRes.json();
          if (ytData.error) {
            console.error('YouTube API error:', JSON.stringify(ytData.error));
            process.exit(1);
          }
          const video = (ytData.items || [])[0];
          if (!video) {
            console.log('No YouTube video uploaded in the last 24 hours — skipping.');
            process.exit(0);
          }
          const videoId = video.id.videoId;
          const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;
          const videoPublished = new Date(video.snippet.publishedAt).getTime();
          const decodeEntities = (s) => s
            .replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"')
            .replace(/&lt;/g, '<').replace(/&gt;/g, '>');
          const videoTitle = decodeEntities(video.snippet.title || '').trim();

          // 3. Fetch the target Strava activity — a specific one if overridden
          //    (manual re-apply), otherwise whatever's currently latest.
          const actRes = await fetch(
            ACTIVITY_ID_OVERRIDE
              ? `https://www.strava.com/api/v3/activities/${ACTIVITY_ID_OVERRIDE}`
              : 'https://www.strava.com/api/v3/athlete/activities?per_page=1',
            { headers: { Authorization: `Bearer ${access_token}` } }
          );
          if (!actRes.ok) {
            console.error(`Strava activities fetch failed (${actRes.status}):`, await actRes.text());
            process.exit(1);
          }
          const actBody = await actRes.json();
          const activity = ACTIVITY_ID_OVERRIDE ? actBody : (actBody || [])[0];
          if (!activity) {
            console.log('No Strava activity found — skipping.');
            process.exit(0);
          }
          const actStart = new Date(activity.start_date).getTime();
          const stravaActivityUrl = `https://www.strava.com/activities/${activity.id}`;

          // 4. Video must have been published after the activity started
          //    (skipped for a manual apply — the activity/video pairing is explicit)
          if (!MANUAL_APPLY && videoPublished < actStart) {
            console.log(
              `YouTube video (${new Date(videoPublished).toISOString()}) predates ` +
              `activity start (${activity.start_date}) — skipping.`
            );
            process.exit(0);
          }

          // 5. Fetch the full activity (description, stats, segment names)
          const detRes = await fetch(
            `https://www.strava.com/api/v3/activities/${activity.id}`,
            { headers: { Authorization: `Bearer ${access_token}` } }
          );
          if (!detRes.ok) {
            console.error(`Strava activity fetch failed (${detRes.status}):`, await detRes.text());
            process.exit(1);
          }
          const detail = await detRes.json();
          const description = detail.description || '';
          if (!DRY_RUN && !MANUAL_APPLY && description.includes('youtube.com')) {
            console.log('YouTube link already in activity description — skipping.');
            process.exit(0);
          }

          const mi = (detail.distance / 1609.344).toFixed(1);
          const totalMin = Math.round(detail.moving_time / 60);
          const timeStr = `${Math.floor(totalMin / 60)}:${String(totalMin % 60).padStart(2, '0')}`;
          const ft = Math.round((detail.total_elevation_gain || 0) * 3.28084).toLocaleString('en-US');

          // 5b. Rider's own dictated ride summary, if one was recorded after !stop.
          //     Purely additive context for Claude — every tone rule below still applies.
          let riderNotes = RIDER_NOTES_OVERRIDE || null;
          if (!riderNotes) {
            try {
              const parsed = JSON.parse(process.env.RIDE_SUMMARY_JSON || 'null');
              if (parsed && typeof parsed.summary === 'string' && parsed.summary.trim()) {
                riderNotes = parsed.summary.trim();
              }
            } catch {}
          }

          // 5c. Real road names from the GPS breadcrumb (optional — only runs if
          //     MAPBOX_TOKEN is configured). Segment names above are Strava-defined
          //     ride efforts, not roads; this uses actual map matching against the
          //     ride's GPS trace to get the real roads ridden, ranked by how much
          //     distance was covered on each. Every failure path here falls back to
          //     silence (roadNames stays []) — this must never block the rest of the
          //     pipeline, whether that's a missing token, a private/streamless
          //     activity, or a Mapbox outage.
          let roadNames = [];
          if (MAPBOX_TOKEN) {
            try {
              const streamRes = await fetch(
                `https://www.strava.com/api/v3/activities/${activity.id}/streams?keys=latlng&key_by_type=true`,
                { headers: { Authorization: `Bearer ${access_token}` } }
              );
              if (streamRes.ok) {
                const streamData = await streamRes.json();
                const points = (streamData.latlng && streamData.latlng.data) || []; // [[lat,lng], ...]
                if (points.length >= 2) {
                  // Downsample: keep a point only once it's >=25m from the last kept
                  // point (same decimation distance the relay's own breadcrumb trail
                  // uses) — thousands of raw GPS points is far more than needed to
                  // trace the route shape, and Mapbox caps requests at 100 points.
                  const MIN_GAP_M = 25;
                  const haversineM = (a, b) => {
                    const R = 6371000, dLat = (b[0] - a[0]) * Math.PI / 180, dLng = (b[1] - a[1]) * Math.PI / 180;
                    const lat = (a[0] + b[0]) / 2 * Math.PI / 180, x = dLng * Math.cos(lat);
                    return Math.sqrt(dLat * dLat + x * x) * R;
                  };
                  const thinned = [points[0]];
                  for (let i = 1; i < points.length; i++) {
                    if (haversineM(thinned[thinned.length - 1], points[i]) >= MIN_GAP_M) thinned.push(points[i]);
                  }
                  const last = points[points.length - 1];
                  if (thinned[thinned.length - 1] !== last) thinned.push(last);

                  // Chunk into Mapbox's 100-coordinate-per-request limit.
                  const CHUNK = 100;
                  const chunks = [];
                  for (let i = 0; i < thinned.length; i += CHUNK) chunks.push(thinned.slice(i, i + CHUNK));

                  const namedDistances = new Map(); // road name -> total metres ridden on it
                  for (const chunk of chunks) {
                    if (chunk.length < 2) continue;
                    const coordStr = chunk.map(([lat, lng]) => `${lng},${lat}`).join(';');
                    // A generous 25m match radius per point — real GPS traces (especially
                    // under tree cover / in canyons) wander more than Mapbox's tight
                    // default, and a rejected match is worse than a slightly loose one.
                    const radiusStr = chunk.map(() => '25').join(';');
                    const url = `https://api.mapbox.com/matching/v5/mapbox/cycling/${coordStr}` +
                      `?access_token=${encodeURIComponent(MAPBOX_TOKEN)}&steps=true&geometries=geojson` +
                      `&overview=false&radiuses=${radiusStr}`;
                    const mbRes = await fetch(url);
                    if (!mbRes.ok) continue; // skip this chunk, never fail the run over it
                    const mbData = await mbRes.json();
                    const matching = (mbData.matchings || [])[0];
                    if (!matching) continue;
                    for (const leg of matching.legs || []) {
                      for (const step of leg.steps || []) {
                        const name = (step.name || '').trim();
                        if (!name) continue;
                        namedDistances.set(name, (namedDistances.get(name) || 0) + (step.distance || 0));
                      }
                    }
                  }
                  roadNames = [...namedDistances.entries()]
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 8)
                    .map(([name]) => name);
                }
              }
            } catch (e) {
              console.log('Road-name map matching failed (non-fatal, falling back to segments only):', e.message);
            }
          }

          // 6. Generate an understated title + plain, factual opener with Claude.
          //    Falls back to the existing title and the video title as the
          //    opener if the key is missing or the call fails. Manual apply skips
          //    Claude entirely and uses the exact reviewed text instead.
          let title = MANUAL_APPLY ? TITLE_OVERRIDE : null;
          let hook = MANUAL_APPLY ? OPENER_OVERRIDE : videoTitle;
          if (!MANUAL_APPLY && CLAUDE_KEY) {
            try {
              // Rank segments by Strava's own athlete_count (unique riders who've ever
              // done it) rather than just ride order — the well-known, widely-ridden
              // segments surface first instead of one-off/junk auto-generated ones.
              // Dedupe by segment id (not name) first, capped to bound API calls.
              const segmentIdPairs = [...new Map(
                (detail.segment_efforts || [])
                  .filter(e => e.segment && e.segment.id)
                  .map(e => [e.segment.id, e.segment_name || e.segment.name])
              ).entries()].slice(0, 15);
              const segmentPopularity = await Promise.all(segmentIdPairs.map(async ([id, name]) => {
                try {
                  const segRes = await fetch(`https://www.strava.com/api/v3/segments/${id}`, {
                    headers: { Authorization: `Bearer ${access_token}` },
                  });
                  if (!segRes.ok) return { name, athleteCount: 0 };
                  const segDetail = await segRes.json();
                  return { name, athleteCount: segDetail.athlete_count || 0 };
                } catch {
                  return { name, athleteCount: 0 };
                }
              }));
              const segments = segmentPopularity
                .sort((a, b) => b.athleteCount - a.athleteCount)
                .slice(0, 6)
                .map(s => s.name)
                .filter(Boolean);
              const promptLines = [
                'Write a title and an opening line for a Strava cycling activity.',
                '',
                'Style rules (apply to both):',
                '- Plain and factual. State what the route was — roads, terrain, landmarks — the way you\'d describe it to a friend, not narrate a feeling.',
                '- The segment list below is Strava-defined ride efforts, ranked by rider popularity — NOT a list of road names. Only state one as the name of a road if it plausibly reads like one (e.g. "Moose-Wilson Rd"). Otherwise treat it as a landmark/feature reference, or leave it out rather than implying it was the road surface you rode on.',
                '- The "Roads ridden" list, if present, IS real road names (matched from GPS, ranked by distance covered) — these you can state directly and confidently as the roads you were on, in roughly the order given.',
                '- Never mention PRs, achievements, speed, or performance — no bragging.',
                '- No calls to action, no hashtags, no emoji, no quotation marks.',
                '- If the opener is two sentences, each sentence must add NEW information — a different place, feature, or detail. Never restate or rephrase the same landmark, road segment, or feature in both sentences.',
                '- BANNED: metaphor, personification (light/gravel/road "doing" something), rhetorical questions, invented internal feelings or unexplainable moments ("something I couldn\'t explain"), any line that sounds like the opening of a blog post or travel essay.',
                '- The opener should quietly make the reader curious enough to watch the ride video linked below it, without ever asking them to, and without overselling it.',
                '',
                'Title: a short activity title (roughly 3-7 words). Good example: "Morning Miles Under the Tetons".',
                'Opener: one or two short sentences for the top of the activity description. Good example (plain, factual, no metaphor, each clause adds something new): "Morning spin up Moose–Wilson Road and through the park to Jenny Lake — quiet roads, two stretches of gravel, and the Tetons out in full the whole way."',
                'Bad example 1 (too flowery — do not write like this): "The gravel stretch north of the fee station has a way of pulling your eyes off the road and toward the ridgeline. Somewhere between Jenny Lake and the Moose entrance the morning light did something I couldn\'t quite explain."',
                'Bad example 2 (repeats the same detail across both sentences — do not write like this): "Rode Moose-Wilson Road north from the fee station, including the gravel section, then up to Jenny Lake and back down toward the Moose entrance. The gravel stretch north of the fee station is on the video below."',
                '',
                'Ride data:',
                `- Current activity name: ${detail.name}`,
                `- Start (local): ${detail.start_date_local}`,
                `- Distance: ${mi} mi · Moving time: ${timeStr} · Elevation gain: ${ft} ft`,
                `- Video title: ${videoTitle}`,
                `- Popular segments ridden (most riders first): ${segments.join('; ') || 'n/a'}`,
              ];
              if (roadNames.length) {
                promptLines.push(`- Roads ridden (most distance first): ${roadNames.join('; ')}`);
              }
              if (riderNotes) {
                promptLines.push(
                  '',
                  'The rider recorded these notes right after finishing (their own words, voice-to-text, may be informal or fragmented). Weave in specific, true details from these notes where natural, but keep following every style rule above (plain/factual, no metaphor, no personification, no repetition):',
                  `"""${riderNotes}"""`
                );
              }
              const prompt = promptLines.join('\n');

              const claudeRes = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                  'x-api-key': CLAUDE_KEY,
                  'anthropic-version': '2023-06-01',
                  'content-type': 'application/json',
                },
                body: JSON.stringify({
                  model: 'claude-opus-4-8',
                  max_tokens: 1024,
                  messages: [{ role: 'user', content: prompt }],
                  output_config: {
                    format: {
                      type: 'json_schema',
                      schema: {
                        type: 'object',
                        properties: {
                          title: { type: 'string' },
                          opener: { type: 'string' },
                        },
                        required: ['title', 'opener'],
                        additionalProperties: false,
                      },
                    },
                  },
                }),
              });
              const claudeData = await claudeRes.json();
              if (claudeRes.ok && claudeData.stop_reason !== 'refusal') {
                const text = (claudeData.content || [])
                  .filter(b => b.type === 'text').map(b => b.text).join('').trim();
                const parsed = JSON.parse(text);
                if (parsed.title && parsed.title.length <= 100) {
                  title = parsed.title.trim();
                }
                if (parsed.opener && parsed.opener.length <= 400) {
                  hook = parsed.opener.trim();
                }
                console.log('Using Claude-generated title and opener' + (riderNotes ? ' (with rider notes).' : '.'));
              } else {
                console.log('Claude API error — falling back to existing title / video title:', JSON.stringify(claudeData.error || claudeData.stop_reason));
              }
            } catch (err) {
              console.log('Claude call failed — falling back to existing title / video title:', err.message);
            }
          }

          // 7. Compose the description: opener, one stat line, camera line + link
          const statLine = `${mi} mi · ${timeStr} · ${ft} ft`;
          const parts = [];
          if (hook) parts.push(hook);
          parts.push(statLine);
          parts.push(`Brought the camera along for this one 🎥\n${videoUrl}`);
          const block = parts.join('\n\n');
          // Manual apply replaces the whole description (it's re-doing an existing post,
          // so appending on top of the old auto-generated text would just duplicate it);
          // the normal flow appends onto whatever the rider already wrote, unchanged.
          const newDescription = MANUAL_APPLY ? block : (description ? `${description}\n\n${block}` : block);

          if (DRY_RUN) {
            console.log('===== DRY RUN — nothing written to Strava or YouTube =====');
            console.log('Title:', title || `(unchanged: "${detail.name}")`);
            console.log('Description that would be appended:\n' + block);
            console.log('Full new description:\n' + newDescription);
            process.exit(0);
          }

          // 8. Update the activity description (and title, if Claude generated one)
          //    (Strava's API no longer allows posting comments, so we update
          //    the activity directly instead — fully supported with activity:write)
          const updateBody = { description: newDescription };
          if (title) updateBody.name = title;
          const updRes = await fetch(
            `https://www.strava.com/api/v3/activities/${activity.id}`,
            {
              method: 'PUT',
              headers: {
                Authorization: `Bearer ${access_token}`,
                'Content-Type': 'application/x-www-form-urlencoded',
              },
              body: new URLSearchParams(updateBody).toString(),
            }
          );
          if (!updRes.ok) {
            const body = await updRes.text();
            console.error(`Strava activity update failed (${updRes.status}):`, body);
            process.exit(1);
          }
          console.log(`Updated Strava activity ${activity.id} (title: "${title || detail.name}") with ${videoUrl}`);
          // Signals the "delete consumed ride summary" step downstream — only set on a
          // genuine Strava write, never on the early skip branches above.
          emitOutput('strava_updated', 'true');

          // 9. Mirror the description onto the YouTube video itself, linking back to
          //    Strava instead of to the video. Best-effort: never fails the run, since
          //    the Strava update above is the primary deliverable and already succeeded.
          const YT_OAUTH_ID     = process.env.YOUTUBE_OAUTH_CLIENT_ID;
          const YT_OAUTH_SECRET = process.env.YOUTUBE_OAUTH_CLIENT_SECRET;
          const YT_OAUTH_REFRESH = process.env.YOUTUBE_OAUTH_REFRESH_TOKEN;
          if (!YT_OAUTH_ID || !YT_OAUTH_SECRET || !YT_OAUTH_REFRESH) {
            console.log('YouTube OAuth secrets not configured — skipping YouTube description sync.');
          } else {
            try {
              const ytTokenRes = await fetch('https://oauth2.googleapis.com/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                  client_id: YT_OAUTH_ID,
                  client_secret: YT_OAUTH_SECRET,
                  refresh_token: YT_OAUTH_REFRESH,
                  grant_type: 'refresh_token',
                }).toString(),
              });
              const ytTokenData = await ytTokenRes.json();
              if (!ytTokenData.access_token) {
                throw new Error('YouTube OAuth refresh failed: ' + JSON.stringify(ytTokenData));
              }
              const ytAccessToken = ytTokenData.access_token;

              // videos.update requires resending the whole snippet (title/categoryId/etc.)
              // or YouTube silently clears the fields we don't include — fetch it first.
              const snippetRes = await fetch(
                `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${encodeURIComponent(videoId)}`,
                { headers: { Authorization: `Bearer ${ytAccessToken}` } }
              );
              const snippetData = await snippetRes.json();
              const currentSnippet = (snippetData.items || [])[0]?.snippet;
              if (!currentSnippet) {
                throw new Error('Could not fetch current YouTube video snippet.');
              }

              const currentYtDescription = currentSnippet.description || '';
              if (currentYtDescription.includes(stravaActivityUrl)) {
                console.log('Strava link already in YouTube description — skipping YouTube sync.');
              } else {
                const ytParts = [];
                if (hook) ytParts.push(hook);
                ytParts.push(statLine);
                ytParts.push(`Full ride data on Strava 🚴\n${stravaActivityUrl}`);
                const ytBlock = ytParts.join('\n\n');
                const mutatedDescription = currentYtDescription
                  ? `${currentYtDescription}\n\n${ytBlock}`
                  : ytBlock;

                const updateRes = await fetch('https://www.googleapis.com/youtube/v3/videos?part=snippet', {
                  method: 'PUT',
                  headers: {
                    Authorization: `Bearer ${ytAccessToken}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    id: videoId,
                    snippet: { ...currentSnippet, description: mutatedDescription },
                  }),
                });
                if (!updateRes.ok) {
                  const errBody = await updateRes.text();
                  throw new Error(`YouTube videos.update failed (${updateRes.status}): ${errBody}`);
                }
                console.log(`Updated YouTube video ${videoId} description to link back to ${stravaActivityUrl}`);
              }
            } catch (err) {
              console.error('YouTube description sync failed (non-fatal):', err.message);
            }
          }
          EOF

      - name: Delete consumed ride summary
        if: steps.ride_summary.outputs.found == 'true' && steps.sync.outputs.strava_updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh api repos/${{ github.repository }}/contents/data/ride-summary.json --jq .sha)
          gh api -X DELETE repos/${{ github.repository }}/contents/data/ride-summary.json \
            -f message="ride-summary: consumed by run ${{ github.run_id }}" -f sha="$SHA"

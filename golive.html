<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>GO LIVE — stream control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d;
    --panel:#121419;
    --line:#23262e;
    --text:#e8eaed;
    --dim:#6b7280;
    --live:#ff2f3c;
    --ready:#37e6a4;
    --wait:#ffb43b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"IBM Plex Mono",monospace;
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;
    -webkit-tap-highlight-color:transparent;
    background-image:
      radial-gradient(120% 80% at 50% -10%, rgba(55,230,164,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px);
  }
  .deck{
    width:100%;max-width:420px;
    background:linear-gradient(180deg,#15171d,#101218);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px 22px;
    box-shadow:0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .brand{font-family:"Bebas Neue",sans-serif;font-size:30px;letter-spacing:2px;line-height:1}
  .brand small{display:block;font-family:"IBM Plex Mono";font-size:10px;letter-spacing:3px;color:var(--dim);margin-top:4px}
  .chip{
    font-size:11px;letter-spacing:1px;padding:6px 10px;border-radius:999px;
    border:1px solid var(--line);color:var(--dim);display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 0 transparent}
  .chip.on .dot{background:var(--ready)}
  .chip.live .dot{background:var(--live);animation:pulse 1.1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,47,60,0.55)}70%{box-shadow:0 0 0 9px rgba(255,47,60,0)}100%{box-shadow:0 0 0 0 rgba(255,47,60,0)}}

  /* big action button */
  .stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:8px 0 4px}
  .bigbtn{
    width:200px;height:200px;border-radius:50%;border:none;cursor:pointer;
    font-family:"Bebas Neue",sans-serif;letter-spacing:2px;font-size:30px;color:#04110b;
    background:radial-gradient(circle at 50% 35%, #5cf2bb, #1fbf85);
    box-shadow:0 0 0 1px rgba(55,230,164,0.4),0 0 40px rgba(55,230,164,0.25),inset 0 -8px 20px rgba(0,0,0,0.25);
    transition:transform .12s ease, box-shadow .25s ease, background .25s ease, color .25s ease;
    display:flex;align-items:center;justify-content:center;text-align:center;line-height:.9;
  }
  .bigbtn:active{transform:scale(.96)}
  .bigbtn:disabled{opacity:.55;cursor:not-allowed;filter:saturate(.4)}
  .bigbtn.live{
    color:#1a0103;
    background:radial-gradient(circle at 50% 35%, #ff6a73, #e01521);
    box-shadow:0 0 0 1px rgba(255,47,60,0.5),0 0 55px rgba(255,47,60,0.35),inset 0 -8px 20px rgba(0,0,0,0.3);
    animation:livepulse 1.6s ease-in-out infinite;
  }
  @keyframes livepulse{0%,100%{box-shadow:0 0 0 1px rgba(255,47,60,0.5),0 0 45px rgba(255,47,60,0.3),inset 0 -8px 20px rgba(0,0,0,0.3)}50%{box-shadow:0 0 0 1px rgba(255,47,60,0.7),0 0 75px rgba(255,47,60,0.5),inset 0 -8px 20px rgba(0,0,0,0.3)}}

  .readouts{width:100%;border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .cell .k{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
  .cell .v{font-size:14px;margin-top:5px;font-weight:500;word-break:break-word}

  .log{margin-top:14px;background:#0c0e12;border:1px solid var(--line);border-radius:10px;padding:10px 12px;height:84px;overflow:auto;font-size:11px;line-height:1.7;color:#9aa3af}
  .log .t{color:#4b5563}
  .log .ok{color:var(--ready)} .log .err{color:var(--live)} .log .info{color:var(--wait)}

  .connect{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
  .connect p{color:var(--dim);font-size:12px;line-height:1.7;max-width:300px}
  .tw{
    border:none;cursor:pointer;border-radius:10px;padding:14px 22px;font-family:"IBM Plex Mono";font-weight:600;
    font-size:13px;letter-spacing:.5px;background:#9146ff;color:#fff;display:flex;gap:10px;align-items:center;
    box-shadow:0 8px 24px rgba(145,70,255,0.35);transition:transform .1s ease;
  }
  .tw:active{transform:translateY(1px)}
  .hint{font-size:10px;color:#4b5563;text-align:center;margin-top:14px;letter-spacing:.4px}
  .hidden{display:none!important}
</style>
</head>
<body>
  <main class="deck">
    <div class="topbar">
      <div class="brand">GO&nbsp;LIVE<small>STREAM CONTROL</small></div>
      <div id="chip" class="chip"><span class="dot"></span><span id="chipText">OFFLINE</span></div>
    </div>

    <!-- connect screen -->
    <section id="connectView" class="connect">
      <p>Connect your Twitch account to arm the control deck. You'll post <b>!start</b> / <b>!stop</b> to your own chat — your bot does the rest.</p>
      <button class="tw" id="connectBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M4 2 2 6v14h5v2h3l2-2h4l5-5V2H4zm16 11-3 3h-5l-2 2v-2H6V4h14v9zM15 7h-2v5h2V7zm-5 0H8v5h2V7z"/></svg>
        Connect with Twitch
      </button>
    </section>

    <!-- control screen -->
    <section id="controlView" class="stage hidden">
      <button id="bigBtn" class="bigbtn">GO<br>LIVE</button>
      <div class="readouts">
        <div class="cell"><div class="k">Channel</div><div class="v" id="chanCell">—</div></div>
        <div class="cell"><div class="k">State</div><div class="v" id="stateCell">Ready</div></div>
        <div class="cell" style="grid-column:1/3"><div class="k">Location</div><div class="v" id="locCell">tracking off</div></div>
      </div>
      <div class="log" id="log"></div>
    </section>

    <div class="hint" id="hint"></div>
  </main>

<script>
/* ============================ CONFIG ============================ */
// Values injected by the server from Render env vars (TWITCH_CLIENT_ID, RELAY_TOKEN).
// Falls back to the literals below if you run this file without the server.
const SRV = window.__CONFIG__ || {};
const CONFIG = {
  // Your Twitch app's Client ID (set TWITCH_CLIENT_ID in Render).
  CLIENT_ID: SRV.CLIENT_ID || "YOUR_TWITCH_CLIENT_ID",
  // This page's own URL; register it as an OAuth Redirect URL in Twitch.
  REDIRECT_URI: window.location.origin + window.location.pathname,
  SCOPES: "user:write:chat",

  // Location relay (server.js) — same host as this page.
  RELAY_URL: location.origin.replace(/^http/, "ws"),
  RELAY_TOKEN: SRV.RELAY_TOKEN || "change-me",   // auto-generated by Render

  // Privacy: don't broadcast when within this many meters of home (0 = off).
  HOME: { lat: null, lng: null, radiusM: 0 },
};
/* =============================================================== */

const API = "https://api.twitch.tv/helix";
const els = {
  chip: document.getElementById("chip"),
  chipText: document.getElementById("chipText"),
  connectView: document.getElementById("connectView"),
  controlView: document.getElementById("controlView"),
  connectBtn: document.getElementById("connectBtn"),
  bigBtn: document.getElementById("bigBtn"),
  chanCell: document.getElementById("chanCell"),
  stateCell: document.getElementById("stateCell"),
  locCell: document.getElementById("locCell"),
  log: document.getElementById("log"),
  hint: document.getElementById("hint"),
};

let token = null;       // user access token (in memory only)
let userId = null;      // PeloTom's numeric id (broadcaster == sender)
let isLive = false;
let busy = false;
let geoWatch = null;
let relaySock = null;   // WebSocket to the location relay

function log(msg, kind="") {
  const t = new Date().toLocaleTimeString();
  const line = document.createElement("div");
  line.innerHTML = `<span class="t">${t}</span> <span class="${kind}">${msg}</span>`;
  els.log.prepend(line);
}

function setChip(text, mode="") {
  els.chip.className = "chip" + (mode ? " " + mode : "");
  els.chipText.textContent = text;
}

/* ---------- OAuth (implicit grant, no backend/secret) ---------- */
function connect() {
  if (CONFIG.CLIENT_ID.startsWith("YOUR_")) {
    els.hint.textContent = "Set your CLIENT_ID in the CONFIG block first.";
    return;
  }
  const url = "https://id.twitch.tv/oauth2/authorize"
    + "?client_id=" + encodeURIComponent(CONFIG.CLIENT_ID)
    + "&redirect_uri=" + encodeURIComponent(CONFIG.REDIRECT_URI)
    + "&response_type=token"
    + "&scope=" + encodeURIComponent(CONFIG.SCOPES);
  window.location.href = url;
}

function readTokenFromHash() {
  if (!window.location.hash) return null;
  const params = new URLSearchParams(window.location.hash.slice(1));
  const t = params.get("access_token");
  // clean the token out of the address bar
  history.replaceState(null, "", window.location.pathname + window.location.search);
  return t;
}

async function afterAuth(t) {
  token = t;
  setChip("VERIFYING…", "");
  try {
    const res = await fetch(API + "/users", {
      headers: { "Authorization": "Bearer " + token, "Client-Id": CONFIG.CLIENT_ID }
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const me = data.data && data.data[0];
    if (!me) throw new Error("no user");
    userId = me.id;
    els.chanCell.textContent = me.display_name || me.login;
    els.connectView.classList.add("hidden");
    els.controlView.classList.remove("hidden");
    setChip("READY", "on");
    log("Connected as " + (me.display_name || me.login), "ok");
  } catch (e) {
    token = null;
    setChip("OFFLINE", "");
    els.hint.textContent = "Sign-in failed — check CLIENT_ID and the registered Redirect URL.";
    log("Auth failed: " + e.message, "err");
  }
}

/* ---------- send a chat message as the authed user ---------- */
async function sendChat(message) {
  const res = await fetch(API + "/chat/messages", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token,
      "Client-Id": CONFIG.CLIENT_ID,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ broadcaster_id: userId, sender_id: userId, message }),
  });
  if (res.status === 401) { handleExpired(); throw new Error("token expired"); }
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  const first = json.data && json.data[0];
  if (first && first.is_sent === false) {
    throw new Error((first.drop_reason && first.drop_reason.message) || "message dropped");
  }
}

function handleExpired() {
  token = null; userId = null; isLive = false; stopGeo();
  els.controlView.classList.add("hidden");
  els.connectView.classList.remove("hidden");
  setChip("OFFLINE", "");
  log("Session expired — reconnect.", "info");
}

/* ---------- the one button ---------- */
els.bigBtn.addEventListener("click", () => isLive ? endStream() : goLive());

async function goLive() {
  if (busy) return; busy = true;
  setBtn("…", false, true);
  setChip("STARTING…", "");
  try {
    await sendChat("!start");          // your bot launches OBS on the PC
    log("Sent !start", "ok");
    startGeo();
    isLive = true;
    setBtn("END<br>STREAM", true);
    setChip("LIVE", "live");
    els.stateCell.textContent = "Live";
  } catch (e) {
    log("Could not go live: " + e.message, "err");
    setBtn("GO<br>LIVE", false);
    setChip("READY", "on");
  } finally { busy = false; }
}

async function endStream() {
  if (busy) return; busy = true;
  setBtn("…", true, true);
  setChip("STOPPING…", "");
  try {
    await sendChat("!stop");
    log("Sent !stop", "ok");
  } catch (e) {
    log("!stop failed: " + e.message, "err");
  } finally {
    stopGeo();
    isLive = false;
    setBtn("GO<br>LIVE", false);
    setChip("READY", "on");
    els.stateCell.textContent = "Ready";
    busy = false;
  }
}

function setBtn(html, live, disabled=false) {
  els.bigBtn.innerHTML = html;
  els.bigBtn.classList.toggle("live", !!live);
  els.bigBtn.disabled = disabled;
}

/* ---------- geolocation -> relay (your custom web service) ---------- */
function metersBetween(aLat, aLng, bLat, bLng) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(bLat - aLat), dLng = toRad(bLng - aLng);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function startGeo() {
  if (!navigator.geolocation) { els.locCell.textContent = "no GPS in browser"; return; }

  relaySock = new WebSocket(CONFIG.RELAY_URL + "?role=sender&token=" + encodeURIComponent(CONFIG.RELAY_TOKEN));
  relaySock.onopen  = () => log("Relay connected", "ok");
  relaySock.onclose = () => log("Relay disconnected", "info");
  relaySock.onerror = () => log("Relay error", "err");

  geoWatch = navigator.geolocation.watchPosition(
    (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;

      // privacy zone: skip broadcasting near home
      const h = CONFIG.HOME;
      if (h.radiusM > 0 && h.lat != null &&
          metersBetween(latitude, longitude, h.lat, h.lng) < h.radiusM) {
        els.locCell.textContent = "in privacy zone — not broadcasting";
        return;
      }

      els.locCell.textContent = latitude.toFixed(5) + ", " + longitude.toFixed(5) + "  (±" + Math.round(accuracy) + "m)";
      if (relaySock && relaySock.readyState === WebSocket.OPEN) {
        relaySock.send(JSON.stringify({ lat: latitude, lng: longitude, acc: accuracy }));
      }
    },
    (err) => { els.locCell.textContent = "GPS: " + err.message; log("GPS error: " + err.message, "info"); },
    { enableHighAccuracy: true, maximumAge: 2000, timeout: 15000 }
  );
}

function stopGeo() {
  if (geoWatch != null) { navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
  if (relaySock) { try { relaySock.close(); } catch {} relaySock = null; }
  els.locCell.textContent = "tracking off";
}

/* ---------- boot ---------- */
els.connectBtn.addEventListener("click", connect);
const hashToken = readTokenFromHash();
if (hashToken) afterAuth(hashToken);
else setChip("OFFLINE", "");
</script>
</body>
</html>

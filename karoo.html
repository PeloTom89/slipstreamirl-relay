<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bike computer overlay</title>
<style>
  html,body{height:100%;margin:0;background:transparent;overflow:hidden;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  #wrap{height:100%;width:100%;display:flex;align-items:center;justify-content:center}
  /* One base unit tied to source height (font-size:vh); everything below is em,
     so the whole device — including the SPEED/DISTANCE cards — scales with the
     OBS source size. */
  #device{height:96vh;aspect-ratio:62/100;font-size:2.2vh;background:#0c0d10;
    border-radius:1.6em;padding:0.8em 0.7em;box-sizing:border-box;
    display:flex;flex-direction:column;
    box-shadow:0 10px 40px rgba(0,0,0,.55), inset 0 0 0 2px #1c1f26}
  #screen{flex:1;background:#fff;border-radius:0.7em;overflow:hidden;display:flex;flex-direction:column;position:relative}
  #brand{color:#7a8089;text-align:center;font-size:1.05em;font-weight:800;letter-spacing:0.15em;padding:0.4em 0 0.1em}

  #topbar{display:flex;justify-content:space-between;align-items:center;
    padding:0.4em 0.8em;color:#0c0d10;font-weight:700;font-size:1.4em;
    font-variant-numeric:tabular-nums}

  #cards{display:flex;gap:0.5em;padding:0.35em 0.5em 0.5em}
  .card{flex:1;border:1px solid #e6e8eb;border-radius:0.6em;padding:0.4em 0.7em}
  .card .lbl{display:flex;align-items:center;justify-content:space-between;
    color:#8b919a;font-size:0.72em;font-weight:700;letter-spacing:0.06em}
  .card .lbl svg{width:1.2em;height:1.2em}
  .card .val{color:#0c0d10;font-weight:800;font-size:2.5em;line-height:1.05;
    font-variant-numeric:tabular-nums;margin-top:0.05em}
  .card .val .unit{font-size:0.4em;font-weight:700;color:#8b919a;margin-left:0.3em}

  /* Map is the real /overlay page embedded, so cyclist + wind + "?" all carry over. */
  #mapwrap{flex:1;position:relative;background:#e9e7e2}
  #mapwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div id="wrap">
    <div id="device">
      <div id="screen">
        <div id="topbar"><span id="elapsed">0:00:00</span><span id="clock">--:--</span></div>
        <div id="cards">
          <div class="card">
            <div class="lbl"><span>SPEED</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="#8b919a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 2 4 14 12 14 11 22 20 10 12 10 13 2"/></svg>
            </div>
            <div class="val"><span id="speed">0.0</span><span class="unit" id="speedUnit">mph</span></div>
          </div>
          <div class="card">
            <div class="lbl"><span>DISTANCE</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="#8b919a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 18 H14 a4 4 0 0 0 0-8 H10 a4 4 0 0 1 0-8"/></svg>
            </div>
            <div class="val"><span id="dist">0.0</span><span class="unit" id="distUnit">mi</span></div>
          </div>
        </div>
        <div id="mapwrap"><iframe src="/overlay?embed=1" scrolling="no"></iframe></div>
      </div>
      <div id="brand">SLIPSTREAMIRL</div>
    </div>
  </div>

  <script>
    /* ===== CONFIG ===== */
    const RELAY_URL = location.origin.replace(/^http/, "ws");
    const units = (new URLSearchParams(location.search).get("units") || "imperial").toLowerCase();
    const METRIC = units === "metric" || units === "km";
    /* ================== */

    document.getElementById("speedUnit").textContent = METRIC ? "km/h" : "mph";
    document.getElementById("distUnit").textContent  = METRIC ? "km" : "mi";
    const toSpeed = ms => ms * (METRIC ? 3.6 : 2.23694);
    const toDist  = m  => m  / (METRIC ? 1000 : 1609.34);

    const elSpeed = document.getElementById("speed");
    const elDist  = document.getElementById("dist");
    const elElapsed = document.getElementById("elapsed");
    const elClock = document.getElementById("clock");
    let startTs = null;

    function setSpeed(ms) { elSpeed.textContent = toSpeed(ms || 0).toFixed(1); }
    function setDist(m)   { elDist.textContent  = toDist(m || 0).toFixed(1); }

    // Top-bar clock + ride elapsed timer.
    function two(n){ return (n < 10 ? "0" : "") + n; }
    setInterval(() => {
      const d = new Date();
      elClock.textContent = d.getHours() + ":" + two(d.getMinutes());
      if (startTs) {
        let s = Math.floor((Date.now() - startTs) / 1000);
        const h = Math.floor(s / 3600); s -= h * 3600;
        const m = Math.floor(s / 60); s -= m * 60;
        elElapsed.textContent = h + ":" + two(m) + ":" + two(s);
      }
    }, 1000);

    // The map lives in the embedded /overlay iframe; this socket only feeds the
    // SPEED and DISTANCE cards (and the ride timer).
    function connect() {
      const ws = new WebSocket(RELAY_URL + "?role=overlay");
      ws.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          if (d.hidden) { setSpeed(0); return; }   // in privacy zone: paused
          if (typeof d.lat === "number") {
            if (!startTs) startTs = Date.now();
            setSpeed(d.spd);
            setDist(d.dist);
          }
        } catch {}
      };
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => ws.close();
    }
    connect();
  </script>
</body>
</html>

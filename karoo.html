<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bike computer overlay</title>
<style>
  html,body{height:100%;margin:0;background:transparent;overflow:hidden;
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  #wrap{height:100%;width:100%;display:flex;align-items:center;justify-content:center}
  /* One base unit tied to source height (font-size:vh); everything below is em,
     so the whole device — including the SPEED/DISTANCE cards — scales with the
     OBS source size. */
  /* Fit within the container by whichever dimension binds (height in a wide OBS
     source, width in the app's tall narrow popout). Font scales the same way so
     the contents never overflow the device. 59.52vh = 96vh * 62/100. */
  #device{width:min(96vw, 59.52vh);aspect-ratio:62/100;font-size:min(2.2vh, 3.55vw);
    background:#0c0d10;
    border-radius:1.6em;padding:0.8em 0.7em;box-sizing:border-box;
    display:flex;flex-direction:column;
    box-shadow:inset 0 0 0 2px #1c1f26}
  #screen{flex:1;background:#fff;border-radius:0.7em;overflow:hidden;display:flex;flex-direction:column;position:relative}
  #brand{color:#7a8089;text-align:center;font-size:1.4em;font-weight:800;letter-spacing:0.12em;padding:0.35em 0 0.1em}

  #topbar{display:flex;justify-content:space-between;align-items:center;
    padding:0.4em 0.8em;color:#0c0d10;font-weight:700;font-size:1.8em;
    font-variant-numeric:tabular-nums}

  #cards{display:flex;gap:0.5em;padding:0.35em 0.5em 0.5em}
  .card{flex:1;border:1px solid #e6e8eb;border-radius:0.6em;padding:0.4em 0.7em;
    transition:background-color .25s ease}
  .card .lbl{display:flex;align-items:center;justify-content:space-between;
    color:#8b919a;font-size:0.72em;font-weight:700;letter-spacing:0.06em}
  .card .lbl svg{width:1.2em;height:1.2em}
  .card .val{color:#0c0d10;font-weight:800;font-size:2.5em;line-height:1.05;
    font-variant-numeric:tabular-nums;margin-top:0.05em}
  .card .val .unit{font-size:0.4em;font-weight:700;color:#8b919a;margin-left:0.3em}
  .card .val span[id]{transition:color .25s ease}  /* the zone-colored number */

  /* Map is the real /overlay page embedded, so cyclist + wind + "?" all carry over. */
  #mapwrap{flex:1;position:relative;background:#e9e7e2}
  #mapwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <div id="wrap">
    <div id="device">
      <div id="screen">
        <div id="topbar"><span id="elapsed">0:00:00</span><span id="clock">--:--</span></div>
        <div id="cards">
          <div class="card">
            <div class="lbl"><span>SPEED</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="#8b919a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 a8 8 0 1 1 16 0"/><path d="M12 18 L15.5 11"/><circle cx="12" cy="18" r="1"/></svg>
            </div>
            <div class="val"><span id="speed">0.0</span><span class="unit" id="speedUnit">mph</span></div>
          </div>
          <div class="card">
            <div class="lbl"><span>DISTANCE</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="#8b919a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 18 H14 a4 4 0 0 0 0-8 H10 a4 4 0 0 1 0-8"/></svg>
            </div>
            <div class="val"><span id="dist">0.0</span><span class="unit" id="distUnit">mi</span></div>
          </div>
          <div class="card">
            <div class="lbl"><span>WIND</span>
              <svg id="windArrow" viewBox="0 0 24 24" fill="none" stroke="#5b9cf6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .4s ease"><path d="M12 4 L12 20"/><path d="M6 10 L12 4 L18 10"/></svg>
            </div>
            <div class="val"><span id="wind">--</span><span class="unit" id="windUnit">mph</span></div>
          </div>
        </div>
        <div id="cards">
          <div class="card">
            <div class="lbl"><span>3S POWER</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="#8b919a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 2 4 14 12 14 11 22 20 10 12 10 13 2"/></svg>
            </div>
            <div class="val"><span id="power">--</span><span class="unit">W</span></div>
          </div>
          <div class="card">
            <div class="lbl"><span>CADENCE</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="#8b919a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 12 L12 7 M12 12 L16 14"/></svg>
            </div>
            <div class="val"><span id="cadence">--</span><span class="unit">rpm</span></div>
          </div>
          <div class="card">
            <div class="lbl"><span>HEART</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="#e0566a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
            </div>
            <div class="val"><span id="hr">--</span><span class="unit">bpm</span></div>
          </div>
        </div>
        <div id="mapwrap"><iframe src="/overlay?embed=1" scrolling="no"></iframe></div>
      </div>
      <div id="brand">SLIPSTREAMIRL</div>
    </div>
  </div>

  <script>
    /* ===== CONFIG ===== */
    const RELAY_URL = location.origin.replace(/^http/, "ws");
    // ?units sets the initial state; a live {units} message from the app overrides.
    let units = (new URLSearchParams(location.search).get("units") || "imperial").toLowerCase();
    let METRIC = units === "metric" || units === "km";
    /* ================== */

    const elSpeed = document.getElementById("speed");
    const elDist  = document.getElementById("dist");
    const elPower = document.getElementById("power");
    const elCadence = document.getElementById("cadence");
    const elHr = document.getElementById("hr");
    const elElapsed = document.getElementById("elapsed");
    const elClock = document.getElementById("clock");
    const elWind = document.getElementById("wind");
    const elWindArrow = document.getElementById("windArrow");
    let startTs = null;
    let lastSpdMs = 0, lastDistM = 0;
    let lastPower = null, lastCadence = null, lastHr = null;
    let windKmh = null, windDir = null, lastWindFetch = 0;

    // Effort zones: anchors come from the app; the value digits color green→purple.
    let zones = null; // {ftp, lthr, maxhr, cadence, speed(m/s)}
    const ZONE_COLORS = ["#1f9d57", "#caa000", "#e07b1a", "#d8392b", "#8a3fd4"];

    // Returns 0..4 (green..purple) or -1 when not computable.
    function zoneIndex(metric, value) {
      if (!zones || zones.enabled === false || value == null) return -1;
      if (metric === "power" && zones.ftp) {
        const f = zones.ftp;
        return value < f*0.55 ? 0 : value < f*0.76 ? 1 : value < f*0.91 ? 2 : value < f*1.06 ? 3 : 4;
      }
      if (metric === "hr" && zones.lthr) {
        // Below threshold: fractions of LTHR. Above: interpolate toward max HR,
        // so red = threshold→midpoint, purple = midpoint→max.
        const l = zones.lthr, mx = zones.maxhr || l * 1.1;
        const mid = l + (mx - l) * 0.5;
        return value < l*0.85 ? 0 : value < l*0.92 ? 1 : value < l ? 2 : value < mid ? 3 : 4;
      }
      if (metric === "cadence" && zones.cadence) {
        const a = zones.cadence;
        return value < a*0.82 ? 0 : value < a ? 1 : value < a*1.18 ? 2 : value < a*1.29 ? 3 : 4;
      }
      if (metric === "speed" && zones.speed) { // value + anchor both m/s
        const s = zones.speed;
        return value < s*0.44 ? 0 : value < s*0.64 ? 1 : value < s*0.84 ? 2 : value < s*1.2 ? 3 : 4;
      }
      return -1;
    }

    function colorCard(id, metric, value) {
      const el = document.getElementById(id);
      const z = zoneIndex(metric, value);
      el.style.color = z < 0 ? "" : ZONE_COLORS[z];  // color the number only
    }

    function recolorAll() {
      colorCard("speed", "speed", lastSpdMs);
      colorCard("power", "power", lastPower);
      colorCard("cadence", "cadence", lastCadence);
      colorCard("hr", "hr", lastHr);
    }

    function setSensors(d) {
      if (d.power != null)   { lastPower = d.power;     elPower.textContent   = Math.round(d.power);   colorCard("power", "power", lastPower); }
      if (d.cadence != null) { lastCadence = d.cadence; elCadence.textContent = Math.round(d.cadence); colorCard("cadence", "cadence", lastCadence); }
      if (d.hr != null)      { lastHr = d.hr;           elHr.textContent      = Math.round(d.hr);      colorCard("hr", "hr", lastHr); }
    }

    const toSpeed = ms => ms * (METRIC ? 3.6 : 2.23694);
    const toDist  = m  => m  / (METRIC ? 1000 : 1609.34);

    function setSpeed(ms) { lastSpdMs = ms || 0; elSpeed.textContent = toSpeed(lastSpdMs).toFixed(1); colorCard("speed", "speed", lastSpdMs); }
    function setDist(m)   { lastDistM = m  || 0; elDist.textContent  = toDist(lastDistM).toFixed(1); }

    // Wind speed (km/h from Open-Meteo) -> current units; arrow points the way the
    // wind is blowing TO (dir is the direction it comes FROM, so + 180).
    function renderWind() {
      if (windKmh == null) return;
      const v = METRIC ? windKmh : windKmh * 0.621371;
      elWind.textContent = v.toFixed(0);
      document.getElementById("windUnit").textContent = METRIC ? "km/h" : "mph";
      if (windDir != null) elWindArrow.style.transform = `rotate(${(windDir + 180) % 360}deg)`;
    }
    async function fetchWind(lat, lng) {
      try {
        const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=wind_speed_10m,wind_direction_10m`);
        const data = await r.json();
        windKmh = data.current.wind_speed_10m;
        windDir = data.current.wind_direction_10m;
        renderWind();
      } catch {}
    }

    function applyUnits() {
      document.getElementById("speedUnit").textContent = METRIC ? "km/h" : "mph";
      document.getElementById("distUnit").textContent  = METRIC ? "km" : "mi";
      // Re-render last known values in the new units.
      elSpeed.textContent = toSpeed(lastSpdMs).toFixed(1);
      elDist.textContent  = toDist(lastDistM).toFixed(1);
      renderWind();
    }
    applyUnits();

    // Top-bar clock + ride elapsed timer.
    function two(n){ return (n < 10 ? "0" : "") + n; }
    setInterval(() => {
      const d = new Date();
      elClock.textContent = d.getHours() + ":" + two(d.getMinutes());
      if (startTs) {
        let s = Math.floor((Date.now() - startTs) / 1000);
        const h = Math.floor(s / 3600); s -= h * 3600;
        const m = Math.floor(s / 60); s -= m * 60;
        elElapsed.textContent = h + ":" + two(m) + ":" + two(s);
      }
    }, 1000);

    // The map lives in the embedded /overlay iframe; this socket only feeds the
    // SPEED and DISTANCE cards (and the ride timer).
    function connect() {
      const ws = new WebSocket(RELAY_URL + "?role=overlay");
      ws.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          if (typeof d.units === "string") { units = d.units; METRIC = units === "metric" || units === "km"; applyUnits(); }
          if (d.zones) { zones = d.zones; recolorAll(); return; }
          if ("power" in d || "cadence" in d || "hr" in d) { setSensors(d); return; }
          if (d.offline) { setSpeed(0); return; }   // stream ended
          if (d.hidden) { setSpeed(0); return; }    // in privacy zone: paused
          if (typeof d.lat === "number") {
            if (!startTs) startTs = Date.now();
            setSpeed(d.spd);
            setDist(d.dist);
            const now = Date.now();
            if (now - lastWindFetch > 10 * 60 * 1000) { lastWindFetch = now; fetchWind(d.lat, d.lng); }
          }
        } catch {}
      };
      ws.onclose = () => setTimeout(connect, 2000);
      ws.onerror = () => ws.close();
    }
    connect();
  </script>
</body>
</html>

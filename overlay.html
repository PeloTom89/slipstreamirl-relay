<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Location overlay</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html,body{height:100%;margin:0;background:transparent;overflow:hidden}
  #map{height:100%;width:100%;background:transparent}
  .leaflet-container{border-radius:16px;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
  #wind-canvas{position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:500;border-radius:16px}
  #offline{position:absolute;top:8px;left:8px;font:600 11px/1 monospace;color:#fff;
    background:rgba(0,0,0,.55);padding:5px 8px;border-radius:6px;display:none;z-index:1000}
  .pulse-ring{width:40px;height:40px;border-radius:50%;border:3px solid #1a6abf;
    box-sizing:border-box;animation:pulse-ring 1.8s ease-out infinite}
  @keyframes pulse-ring{
    0%  {transform:scale(0.6);opacity:0.9}
    100%{transform:scale(2.2);opacity:0}
  }
</style>
</head>
<body>
  <div id="map"></div>
  <canvas id="wind-canvas"></canvas>
  <div id="offline">no signal</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* ===== CONFIG ===== */
    const RELAY_URL = location.origin.replace(/^http/, "ws");
    const ZOOM = 16;
    /* ================== */

    const map = L.map("map", { zoomControl:false, attributionControl:true }).setView([0,0], ZOOM);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const offline = document.getElementById("offline");
    let marker = null, halo = null, gotFix = false;

    const pulseIcon = L.divIcon({
      className: "",
      iconSize: [40, 40],
      iconAnchor: [20, 20],
      html: '<div class="pulse-ring"></div>'
    });

    function makeIcon(hdg) {
      const rot = (typeof hdg === "number" && hdg >= 0) ? hdg : 0;
      return L.divIcon({
        className: "",
        iconSize: [26, 40],
        iconAnchor: [13, 20],
        html: `<svg width="26" height="40" viewBox="-22 -33 44 66"
                 style="transform:rotate(${rot}deg);filter:drop-shadow(0 3px 7px rgba(0,0,0,.75))">
               <!-- Front wheel (top = direction of travel) -->
               <ellipse cx="0" cy="-27" rx="4.5" ry="11" fill="#111"/>
               <!-- Back wheel -->
               <ellipse cx="0" cy="27" rx="4.5" ry="11" fill="#111"/>
               <!-- Frame -->
               <rect x="-1.5" y="-15" width="3" height="42" rx="1.5" fill="#555"/>
               <!-- Body / jersey -->
               <ellipse cx="0" cy="8" rx="9" ry="13" fill="#1a6abf"/>
               <!-- Shoulders -->
               <ellipse cx="0" cy="-4" rx="11" ry="5.5" fill="#1a6abf"/>
               <!-- Arms reaching to bars -->
               <line x1="-11" y1="-4" x2="-13" y2="-20" stroke="#1a6abf" stroke-width="3.5" stroke-linecap="round"/>
               <line x1="11"  y1="-4" x2="13"  y2="-20" stroke="#1a6abf" stroke-width="3.5" stroke-linecap="round"/>
               <!-- Handlebars -->
               <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
               <!-- Helmet -->
               <ellipse cx="0" cy="-14" rx="8.5" ry="9.5" fill="#ffffff"/>
               <!-- Helmet vents -->
               <line x1="-4" y1="-18" x2="-4" y2="-11" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
               <line x1="0"  y1="-19" x2="0"  y2="-11" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
               <line x1="4"  y1="-18" x2="4"  y2="-11" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
               </svg>`
      });
    }

    function place(lat, lng, hdg) {
      const ll = [lat, lng];
      if (!marker) {
        halo = L.marker(ll, { icon: pulseIcon, zIndexOffset: -1 }).addTo(map);
        marker = L.marker(ll, { icon: makeIcon(hdg) }).addTo(map);
        map.setView(ll, ZOOM);
      } else {
        halo.setLatLng(ll);
        marker.setLatLng(ll);
        marker.setIcon(makeIcon(hdg));
        map.panTo(ll, { animate:true, duration:.6 });
      }
      gotFix = true;
      offline.style.display = "none";
    }

    /* ===== Wind particle system ===== */
    const canvas = document.getElementById("wind-canvas");
    const ctx = canvas.getContext("2d");

    // wind.vx/vy: unit vector in the direction wind is blowing TO
    // wind.speed: pixels per frame
    let wind = null;
    const PARTICLE_COUNT = 120;
    const particles = [];

    function resizeCanvas() {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function resetParticle(p) {
      p.x         = Math.random() * canvas.width;
      p.y         = Math.random() * canvas.height;
      p.age       = Math.random() * 60;
      p.maxAge    = 60 + Math.random() * 100;
      p.speedMult = 0.4 + Math.random() * 1.2;
      p.size      = 6 + Math.random() * 7;
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = {};
      resetParticle(p);
      particles.push(p);
    }

    function animateWind() {
      requestAnimationFrame(animateWind);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!wind || !gotFix) return;

      const angle = Math.atan2(wind.vy, wind.vx);

      for (const p of particles) {
        p.x += wind.vx * wind.speed * p.speedMult;
        p.y += wind.vy * wind.speed * p.speedMult;
        p.age++;

        if (p.age > p.maxAge ||
            p.x < -20 || p.x > canvas.width  + 20 ||
            p.y < -20 || p.y > canvas.height + 20) {
          resetParticle(p);
          continue;
        }

        const alpha = Math.sin(Math.PI * (p.age / p.maxAge)) * 0.8;
        const s     = p.size;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(angle);
        ctx.globalAlpha  = alpha;
        ctx.fillStyle    = "#fffceb";
        ctx.shadowColor  = "rgba(255,240,180,0.5)";
        ctx.shadowBlur   = 5;
        ctx.beginPath();
        ctx.moveTo( s,          0);           // tip
        ctx.lineTo(-s * 0.5, -s * 0.55);     // back-left wing
        ctx.lineTo(-s * 0.2,    0);           // tail notch
        ctx.lineTo(-s * 0.5,  s * 0.55);     // back-right wing
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
    animateWind();

    async function fetchWind(lat, lng) {
      try {
        const r = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}` +
          `&current=wind_speed_10m,wind_direction_10m`
        );
        const data = await r.json();
        const spd = data.current.wind_speed_10m;    // km/h
        const dir = data.current.wind_direction_10m; // degrees FROM which wind blows
        // Convert to the direction wind is blowing TO, then to a screen unit vector.
        const rad = ((dir + 180) % 360) * Math.PI / 180;
        wind = {
          vx:    Math.sin(rad),
          vy:   -Math.cos(rad),           // canvas y increases downward
          speed: Math.max(0.4, spd / 15), // ~0.4 px/frame calm, ~3+ px/frame strong
        };
      } catch {}
    }

    let lastWindFetch = 0;

    function connect() {
      const ws = new WebSocket(RELAY_URL + "?role=overlay");
      ws.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          if (typeof d.lat === "number") {
            place(d.lat, d.lng, d.hdg);
            // Refresh wind data at most once every 10 minutes.
            const now = Date.now();
            if (now - lastWindFetch > 10 * 60 * 1000) {
              lastWindFetch = now;
              fetchWind(d.lat, d.lng);
            }
          }
        } catch {}
      };
      ws.onclose = () => { if (gotFix) offline.style.display = "block"; setTimeout(connect, 2000); };
      ws.onerror = () => ws.close();
    }
    connect();
  </script>
</body>
</html>

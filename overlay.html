<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Location overlay</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html,body{height:100%;margin:0;background:transparent;overflow:hidden}
  #stage{height:100%;width:100%}
  #map{height:100%;width:100%;background:transparent}
  .leaflet-container{border-radius:16px;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
  /* When embedded (e.g. inside the Karoo overlay) fill flush, no rounding/ring. */
  .embed .leaflet-container{border-radius:0;box-shadow:none}
  #wind-canvas{position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:500;border-radius:16px}
  /* The rider marker is a real Leaflet marker glued to the rider's coordinates,
     so the map can be panned freely without detaching the icon from its true
     position. The halo/icon are centred on the marker's anchor point. */
  .me-wrap{position:absolute;left:0;top:0;pointer-events:none}
  .me-halo,.me-icon{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
  .me-wrap.stale .me-halo{display:none}
  .leaflet-marker-icon.me-marker{background:none;border:none}
  .pulse-ring{width:40px;height:40px;border-radius:50%;border:3px solid #1a6abf;
    box-sizing:border-box;animation:pulse-ring 1.8s ease-out infinite}
  @keyframes pulse-ring{
    0%  {transform:scale(0.6);opacity:0.9}
    100%{transform:scale(2.2);opacity:0}
  }
  .qmark{width:34px;height:34px;border-radius:50%;background:rgba(15,23,38,.88);
    border:2px solid #4d96ff;color:#cfe0ff;text-align:center;
    font:800 20px/31px -apple-system,Segoe UI,sans-serif;
    box-shadow:0 2px 6px rgba(0,0,0,.55);animation:qpulse 1.4s ease-in-out infinite}
  @keyframes qpulse{
    0%,100%{transform:scale(1);opacity:.8}
    50%    {transform:scale(1.18);opacity:1}
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="map"></div>
    <canvas id="wind-canvas"></canvas>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* ===== CONFIG ===== */
    const RELAY_URL = location.origin.replace(/^http/, "ws");
    const ZOOM = 16;
    /* ================== */

    const params = new URLSearchParams(location.search);
    if (params.get("embed")) document.documentElement.classList.add("embed");
    // Wind arrows default on; ?wind=off disables them (in-app toggle can override live).
    let windEnabled = params.get("wind") !== "off";

    const map = L.map("map", { zoomControl:false, attributionControl:false }).setView([0,0], ZOOM);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
    }).addTo(map);

    // The app sends an explicit {hidden:true} heartbeat while inside the privacy
    // geofence -> show "?" immediately. STALE_MS is only a fallback for a true
    // silence (stream actually stopped). Coordinates arriving -> cyclist.
    const STALE_MS = 30000;
    let staleTimer = null, stale = false, lastHdg = 0, gotFix = false;
    let marker = null, markerLL = null;
    // Position tween: GPS fixes arrive ~every 3s; we glide between them each frame
    // so the rider + map move smoothly instead of snapping.
    let animFrom = null, animTo = null, animStart = 0, animDur = 3000, lastFixMs = 0;

    function armStale() {
      if (staleTimer) clearTimeout(staleTimer);
      staleTimer = setTimeout(() => setStale(true), STALE_MS);
    }

    function cyclistSVG(hdg) {
      const rot = (typeof hdg === "number" && hdg >= 0) ? hdg : 0;
      return `<svg width="26" height="40" viewBox="-22 -33 44 66"
                 style="transform:rotate(${rot}deg);filter:drop-shadow(0 3px 7px rgba(0,0,0,.75))">
               <!-- Front wheel (top = direction of travel) -->
               <ellipse cx="0" cy="-27" rx="4.5" ry="11" fill="#111"/>
               <!-- Back wheel -->
               <ellipse cx="0" cy="27" rx="4.5" ry="11" fill="#111"/>
               <!-- Frame -->
               <rect x="-1.5" y="-15" width="3" height="42" rx="1.5" fill="#555"/>
               <!-- Body / jersey -->
               <ellipse cx="0" cy="8" rx="9" ry="13" fill="#1a6abf"/>
               <!-- Shoulders -->
               <ellipse cx="0" cy="-4" rx="11" ry="5.5" fill="#1a6abf"/>
               <!-- Arms reaching to bars -->
               <line x1="-11" y1="-4" x2="-13" y2="-20" stroke="#1a6abf" stroke-width="3.5" stroke-linecap="round"/>
               <line x1="11"  y1="-4" x2="13"  y2="-20" stroke="#1a6abf" stroke-width="3.5" stroke-linecap="round"/>
               <!-- Handlebars -->
               <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round"/>
               <!-- Helmet -->
               <ellipse cx="0" cy="-14" rx="8.5" ry="9.5" fill="#ffffff"/>
               <!-- Helmet vents -->
               <line x1="-4" y1="-18" x2="-4" y2="-11" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
               <line x1="0"  y1="-19" x2="0"  y2="-11" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
               <line x1="4"  y1="-18" x2="4"  y2="-11" stroke="#cccccc" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
               </svg>`;
    }

    function iconHtml() {
      const inner = stale ? '<div class="qmark">?</div>' : cyclistSVG(lastHdg);
      return `<div class="me-wrap${stale ? " stale" : ""}">` +
               `<div class="me-halo"><div class="pulse-ring"></div></div>` +
               `<div class="me-icon">${inner}</div>` +
             `</div>`;
    }

    function makeDivIcon() {
      return L.divIcon({ className: "me-marker", html: iconHtml(), iconSize: [0, 0], iconAnchor: [0, 0] });
    }

    function render() {
      if (marker) marker.setIcon(makeDivIcon());
    }

    function setStale(s) {
      if (s === stale) return;
      stale = s;
      render();
    }

    function goOffline() {
      if (staleTimer) clearTimeout(staleTimer);
      staleTimer = null;
      stale = false;
      gotFix = false;
      animFrom = animTo = null;
      if (marker) { map.removeLayer(marker); marker = null; markerLL = null; }
    }

    // Each fix sets a new tween target; animateRider glides there over the time
    // until the next fix is expected (measured from the last interval).
    function place(lat, lng, hdg) {
      lastHdg = hdg;
      const target = [lat, lng];
      const now = performance.now();
      if (!gotFix) {
        markerLL = target;
        animFrom = animTo = target;
        map.setView(target, ZOOM);
        marker = L.marker(target, { icon: makeDivIcon(), interactive: false, keyboard: false }).addTo(map);
      } else {
        animFrom = markerLL || target;
        animTo = target;
        animStart = now;
        animDur = Math.min(Math.max(now - lastFixMs, 800), 6000); // match real cadence
        marker.setIcon(makeDivIcon());
      }
      lastFixMs = now;
      gotFix = true;
      stale = false;
      armStale();
    }

    // Interpolate the rider toward the latest fix and keep the map centred on it.
    function animateRider() {
      requestAnimationFrame(animateRider);
      if (!animTo || !marker) return;
      let t = animDur > 0 ? (performance.now() - animStart) / animDur : 1;
      if (t > 1) t = 1;
      const lat = animFrom[0] + (animTo[0] - animFrom[0]) * t;
      const lng = animFrom[1] + (animTo[1] - animFrom[1]) * t;
      markerLL = [lat, lng];
      marker.setLatLng(markerLL);
      map.setView(markerLL, map.getZoom(), { animate: false });
    }
    animateRider();

    /* ===== Single wind arrow ===== */
    const canvas = document.getElementById("wind-canvas");
    const ctx = canvas.getContext("2d");

    // wind.vx/vy: unit vector in the direction wind is blowing TO
    // wind.speed: pixels per frame (scales with wind speed)
    let wind = null;
    let motionScale = 1, drawScale = 1;
    let arrowOffsets = null; // one signed offset per arrow, distance from canvas centre along wind direction

    function resizeCanvas() {
      const w = canvas.offsetWidth, h = canvas.offsetHeight;
      if (w && h && (canvas.width !== w || canvas.height !== h)) {
        canvas.width  = w;
        canvas.height = h;
      }
      if (canvas.height) { const r = canvas.height / 700; motionScale = r; drawScale = Math.sqrt(r); }
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function animateWind() {
      requestAnimationFrame(animateWind);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!windEnabled || !wind || !gotFix) return;

      // Full sweep distance: enter from one edge of canvas, exit the other.
      const travel   = Math.sqrt(canvas.width ** 2 + canvas.height ** 2) * 0.65;
      const numArrows = 3;
      if (arrowOffsets === null) {
        arrowOffsets = Array.from({length: numArrows}, (_, i) => -travel + i * (2 * travel / numArrows));
      }

      // Centre the wind on the rider's actual screen position so it stays glued
      // to the marker even when the map is panned.
      let cx = canvas.width / 2, cy = canvas.height / 2;
      if (markerLL) {
        const p = map.latLngToContainerPoint(markerLL);
        cx = p.x; cy = p.y;
      }
      const angle = Math.atan2(wind.vy, wind.vx);
      const s     = 22 * drawScale;
      // Fade starts this far from centre on each side — closer = tighter halo around icon.
      const fadeZone = travel * 0.25;

      for (let i = 0; i < numArrows; i++) {
        arrowOffsets[i] += wind.speed * 2 * motionScale;
        if (arrowOffsets[i] > travel) arrowOffsets[i] = -travel;

        const t     = (arrowOffsets[i] + fadeZone) / (2 * fadeZone);
        const alpha = (t >= 0 && t <= 1) ? Math.sin(Math.PI * t) * 0.95 : 0;
        if (alpha <= 0) continue;

        const x = cx + wind.vx * arrowOffsets[i];
        const y = cy + wind.vy * arrowOffsets[i];

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.globalAlpha = alpha;
        ctx.fillStyle   = "#5b9cf6";
        ctx.shadowColor = "rgba(30,80,200,0.5)";
        ctx.shadowBlur  = 8;
        ctx.beginPath();
        ctx.moveTo( s,          0);
        ctx.lineTo(-s * 0.5, -s * 0.55);
        ctx.lineTo(-s * 0.2,    0);
        ctx.lineTo(-s * 0.5,  s * 0.55);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
    animateWind();

    async function fetchWind(lat, lng) {
      try {
        const r = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}` +
          `&current=wind_speed_10m,wind_direction_10m`
        );
        const data = await r.json();
        const spd = data.current.wind_speed_10m;    // km/h
        const dir = data.current.wind_direction_10m; // degrees FROM which wind blows
        // Convert to the direction wind is blowing TO, then to a screen unit vector.
        const rad = ((dir + 180) % 360) * Math.PI / 180;
        wind = {
          vx:    Math.sin(rad),
          vy:   -Math.cos(rad),           // canvas y increases downward
          speed: Math.max(0.4, spd / 15), // ~0.4 px/frame calm, ~3+ px/frame strong
        };
      } catch {}
    }

    let lastWindFetch = 0;

    function connect() {
      const ws = new WebSocket(RELAY_URL + "?role=overlay");
      ws.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          if (typeof d.wind === "boolean") { windEnabled = d.wind; }
          if (d.offline) { goOffline(); return; }
          if (d.hidden) { setStale(true); armStale(); return; }
          if (typeof d.lat === "number") {
            place(d.lat, d.lng, d.hdg);
            // Refresh wind data at most once every 10 minutes.
            const now = Date.now();
            if (now - lastWindFetch > 10 * 60 * 1000) {
              lastWindFetch = now;
              fetchWind(d.lat, d.lng);
            }
          }
        } catch {}
      };
      ws.onclose = () => { setTimeout(connect, 2000); };
      ws.onerror = () => ws.close();
    }
    connect();
  </script>
</body>
</html>

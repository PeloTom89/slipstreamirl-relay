<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Location overlay</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html,body{height:100%;margin:0;background:transparent;overflow:hidden}
  #map{height:100%;width:100%;background:transparent}
  .leaflet-container{border-radius:16px;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
  #wind-canvas{position:absolute;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:500;border-radius:16px}
  #offline{position:absolute;top:8px;left:8px;font:600 11px/1 monospace;color:#fff;
    background:rgba(0,0,0,.55);padding:5px 8px;border-radius:6px;display:none;z-index:1000}
</style>
</head>
<body>
  <div id="map"></div>
  <canvas id="wind-canvas"></canvas>
  <div id="offline">no signal</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* ===== CONFIG ===== */
    const RELAY_URL = location.origin.replace(/^http/, "ws");
    const ZOOM = 16;
    /* ================== */

    const map = L.map("map", { zoomControl:false, attributionControl:true }).setView([0,0], ZOOM);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const offline = document.getElementById("offline");
    let marker = null, halo = null, gotFix = false;

    function makeIcon(hdg) {
      const rot = (typeof hdg === "number" && hdg >= 0) ? hdg : 0;
      return L.divIcon({
        className: "",
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        html: `<svg width="28" height="28" viewBox="0 0 28 28"
                 style="transform:rotate(${rot}deg);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))">
                 <polygon points="14,3 25,25 14,18 3,25"
                   fill="#ff2f3c" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
               </svg>`
      });
    }

    function place(lat, lng, hdg) {
      const ll = [lat, lng];
      if (!marker) {
        halo = L.circleMarker(ll, { radius: 22, color:"#ff2f3c", weight:0, fillColor:"#ff2f3c", fillOpacity:.18 }).addTo(map);
        marker = L.marker(ll, { icon: makeIcon(hdg) }).addTo(map);
        map.setView(ll, ZOOM);
      } else {
        halo.setLatLng(ll);
        marker.setLatLng(ll);
        marker.setIcon(makeIcon(hdg));
        map.panTo(ll, { animate:true, duration:.6 });
      }
      gotFix = true;
      offline.style.display = "none";
    }

    /* ===== Wind particle system ===== */
    const canvas = document.getElementById("wind-canvas");
    const ctx = canvas.getContext("2d");

    // wind.vx/vy: unit vector in the direction wind is blowing TO
    // wind.speed: pixels per frame
    let wind = null;
    const PARTICLE_COUNT = 200;
    const TRAIL_LEN = 14;
    const particles = [];

    function resizeCanvas() {
      canvas.width  = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function resetParticle(p) {
      p.x           = Math.random() * canvas.width;
      p.y           = Math.random() * canvas.height;
      p.age         = Math.random() * 60;
      p.maxAge      = 60 + Math.random() * 80;
      p.trail       = [];
      p.speedMult   = 0.5 + Math.random() * 1.0;   // per-particle speed variation
      p.wobblePhase = Math.random() * Math.PI * 2;
      p.wobbleAmp   = 0.2 + Math.random() * 0.5;   // perpendicular sway amount
      p.wobbleFreq  = 0.03 + Math.random() * 0.04; // sway frequency
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = {};
      resetParticle(p);
      particles.push(p);
    }

    function animateWind() {
      requestAnimationFrame(animateWind);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!wind || !gotFix) return;

      for (const p of particles) {
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > TRAIL_LEN) p.trail.shift();

        // Main movement + sinusoidal wobble perpendicular to wind direction.
        // Perpendicular to (vx, vy) is (-vy, vx).
        p.wobblePhase += p.wobbleFreq;
        const w = Math.sin(p.wobblePhase) * p.wobbleAmp;
        p.x += wind.vx * wind.speed * p.speedMult + (-wind.vy) * w;
        p.y += wind.vy * wind.speed * p.speedMult + ( wind.vx) * w;
        p.age++;

        if (p.age > p.maxAge ||
            p.x < -20 || p.x > canvas.width  + 20 ||
            p.y < -20 || p.y > canvas.height + 20) {
          resetParticle(p);
          continue;
        }

        if (p.trail.length < 2) continue;
        const alpha = Math.sin(Math.PI * (p.age / p.maxAge)) * 0.75;
        ctx.strokeStyle = `rgba(255,252,235,${alpha.toFixed(2)})`;
        ctx.lineWidth = 1.8;
        ctx.lineCap  = "round";
        ctx.shadowColor = "rgba(255,240,180,0.4)";
        ctx.shadowBlur  = 5;
        ctx.beginPath();
        ctx.moveTo(p.trail[0].x, p.trail[0].y);
        for (let i = 1; i < p.trail.length; i++) ctx.lineTo(p.trail[i].x, p.trail[i].y);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }
    animateWind();

    async function fetchWind(lat, lng) {
      try {
        const r = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}` +
          `&current=wind_speed_10m,wind_direction_10m`
        );
        const data = await r.json();
        const spd = data.current.wind_speed_10m;    // km/h
        const dir = data.current.wind_direction_10m; // degrees FROM which wind blows
        // Convert to the direction wind is blowing TO, then to a screen unit vector.
        const rad = ((dir + 180) % 360) * Math.PI / 180;
        wind = {
          vx:    Math.sin(rad),
          vy:   -Math.cos(rad),           // canvas y increases downward
          speed: Math.max(0.4, spd / 15), // ~0.4 px/frame calm, ~3+ px/frame strong
        };
      } catch {}
    }

    let lastWindFetch = 0;

    function connect() {
      const ws = new WebSocket(RELAY_URL + "?role=overlay");
      ws.onmessage = (e) => {
        try {
          const d = JSON.parse(e.data);
          if (typeof d.lat === "number") {
            place(d.lat, d.lng, d.hdg);
            // Refresh wind data at most once every 10 minutes.
            const now = Date.now();
            if (now - lastWindFetch > 10 * 60 * 1000) {
              lastWindFetch = now;
              fetchWind(d.lat, d.lng);
            }
          }
        } catch {}
      };
      ws.onclose = () => { if (gotFix) offline.style.display = "block"; setTimeout(connect, 2000); };
      ws.onerror = () => ws.close();
    }
    connect();
  </script>
</body>
</html>

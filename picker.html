<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Set Geofence Center</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html,body{height:100%;margin:0;background:#0a0b0d;overflow:hidden;font-family:sans-serif}
  #map{height:calc(100% - 76px);width:100%}
  #bar{position:fixed;bottom:0;left:0;right:0;height:76px;background:#0c0e12;
       border-top:1px solid #23262e;display:flex;align-items:center;gap:10px;padding:0 16px}
  #confirm{flex:1;background:#1fbf85;color:#04110b;border:none;padding:14px;
           border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}
  #confirm:disabled{background:#1f2937;color:#4b5563}
  #cancel{background:#1f2937;color:#9aa3af;border:none;padding:14px 18px;
          border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
  #hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);
        background:rgba(0,0,0,.65);color:#fff;padding:8px 16px;border-radius:8px;
        font-size:13px;z-index:1000;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="hint">Tap the map to place your home pin</div>
<div id="map"></div>
<div id="bar">
  <button id="cancel"  onclick="doCancel()">Cancel</button>
  <button id="confirm" disabled onclick="doConfirm()">Confirm Location</button>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const params  = new URLSearchParams(location.search);
  const initLat = parseFloat(params.get("lat"));
  const initLng = parseFloat(params.get("lng"));
  const hasInit = !isNaN(initLat) && !isNaN(initLng);

  const map = L.map("map", { zoomControl: true })
    .setView(hasInit ? [initLat, initLng] : [51.505, -0.09], hasInit ? 16 : 13);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap"
  }).addTo(map);

  let marker = null, chosen = null;

  function place(lat, lng) {
    chosen = { lat, lng };
    if (marker) map.removeLayer(marker);
    marker = L.marker([lat, lng]).addTo(map);
    document.getElementById("confirm").disabled = false;
    document.getElementById("hint").style.display = "none";
  }

  if (hasInit) place(initLat, initLng);
  map.on("click", e => place(e.latlng.lat, e.latlng.lng));

  function doCancel() {
    location.href = "oneclickstream://location?cancelled=1";
  }

  async function doConfirm() {
    if (!chosen) return;
    const btn = document.getElementById("confirm");
    btn.textContent = "Saving…"; btn.disabled = true;
    let name = "";
    try {
      const r = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${chosen.lat}&lon=${chosen.lng}&format=json`,
        { headers: { "User-Agent": "OneClickStream/1.0" } }
      );
      name = (await r.json()).display_name || "";
    } catch {}
    location.href = `oneclickstream://location?lat=${chosen.lat}&lng=${chosen.lng}&name=${encodeURIComponent(name)}`;
  }
</script>
</body>
</html>
